@if (isNavbar) {
  <nav class="bg-gray-800 p-4 flex justify-end gap-4">
    @for (m of mota; track m) {
      <button
        (click)="selectMota(m)"
        class="px-3 py-2 text-sm rounded-md text-gray-300
               hover:bg-white/10 hover:text-white">
        {{ m.name }}
      </button>
    }
  </nav>
} @else {
  <aside class="w-64 h-screen p-4 bg-gray-800 text-white">
    @for (m of mota; track m) {
      <button
        (click)="selectMota(m)"
        class="block w-full text-left px-3 py-2 text-sm rounded-md
               text-gray-300 hover:bg-white/10 hover:text-white">
        {{ m.name }}
      </button>
    }
  </aside>
}
